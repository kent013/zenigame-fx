  verified_at: "2026-04-30"
  confidence: "medium"
  notes: |
    NY DST 切替は IANA tz database (zoneinfo) America/New_York の transition から導出
    (春 = 3月第2日曜 / 秋 = 11月第1日曜、 ただし 2027 春 = 3-14 は 3月第2日曜の例外).
    OANDA broker_full_close_holidays / date_overrides は OANDA spec 確認後に Phase 2 で
    production 反映する (= 現状は経験則ベース、 confidence=medium). Phase 1 は単体テスト
    範囲、 production 反映前に OANDA spec 一次資料を URL 含めて再確認.

