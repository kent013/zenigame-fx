# Alpha Factory FX 既定設定
#
# improve-cycle から参照される GA / バックテストの既定パラメータと、
# 使命達成の判定に用いる live_criteria を定義する。
#
# 使命: 以下 live_criteria を全て満たすイントラデイ FX 戦略ゲノムを 1 つ以上見つけ出すこと。

dataset:
  instrument: EUR_JPY
  # ISO 8601 (UTC) — バックテスト対象期間
  start: "2025-10-01T00:00:00Z"
  end: "2026-04-01T00:00:00Z"

backtest:
  initial_cash: "1000000"
  leverage: 25
  units: 10000

ga:
  population_size: 40
  generations: 15
  crossover_rate: 0.7
  mutation_rate: 0.3
  tournament_size: 3
  elite_count: 2
  max_depth: 4
  fitness_metric: sharpe
  # T-sharpe Phase 1A: trade-level Sharpe のサンプルサイズ最小値。
  # @why: trade_count<N で trade_sharpe_raw を None にして GA fitness の選抜から外す。
  # 30 は Andrew W. Lo (2002) "The Statistics of Sharpe Ratios" の経験則。
  # Phase 1B replay で N=20/30/50 の感度分析を実施し再校正する。
  trade_count_min_for_sharpe: 30
  seed: null  # null = 毎 Run ランダム

# 使命達成判定 — 全てを満たす個体が出現すれば使命達成
live_criteria:
  sharpe_min: 1.0
  total_pnl_min: 50000  # 50k JPY over dataset window
  max_drawdown_max: 0.2  # 20%
  trade_count_min: 50
  trade_count_max: 5000

# Stage A/B/C ゲート設定 (T014 実装)
# - Stage A の評価関数は src/alpha_factory/stage_gate.py::evaluate_stage_a
# - Stage B / C も同モジュールに pure function として実装。
# - StageGateConfig (frozen dataclass) を yaml から構築する loader は
#   別 TODO (GA runner 統合) で実装。本ファイルは SSOT としてのみ。
stage_gate:
  stage_a:
    window_days: 60
    target_pass_rate: 0.15      # 探索圧の代理指標 (calibrate-gate T027 で使用)
    alpha: 0.03
    threshold: 0.0              # T027 calibrate-gate により Run 終了後に動的更新
    # T027 calibrate-gate 設定 (deterministic 制御則)
    # - 概念設計: docs/alpha_factory/concepts/calibrate-gate.md
    # - SSOT: 本セクション、loader: scripts/alpha_factory/calibrate_gate.py
    calibrate:
      enabled: true
      # last_k_generations / all_generations / generation_weighted_mean
      aggregation_mode: last_k_generations
      aggregation_window: 5
      pass_rate_tolerance_abs: 0.05      # dead-band 半幅 (pass_rate 絶対)
      threshold_delta_abs_max: 0.5       # 1 Run の変更幅上限 (fitness_pen 絶対)
      threshold_floor: -100.0
      threshold_ceiling: 100.0
      min_sample_size: 30                # この未満は skip + WARN
      eps_var: 0.000000001               # quantile-snap skip 判定 (var(fitness_pen))
  stage_b:
    window_months: 18
    wf_train_days: 120
    wf_test_days: 20
    wf_step_days: 20
    wf_embargo_days: 1
    median_oos_sharpe_min: 0.20
    positive_fold_min: 0.60
    dsr_min: 0.0                # monitor_only (Phase 4 で hard 化)
  stage_c:
    holdout_days: 60
    spread_stress_multiplier: 1.5
    # 1.5x stress 後の hard gate 下限 (live_criteria.* を流用しないため別定義)
    spread_stress_min_total_pnl: 0.0
    spread_stress_min_sharpe: 0.0
    # live_criteria は上記 SSOT セクションを参照 (重複定義しない)

# Cross-pair (ii-lite) evaluation 設定 (T016)
# - 実装: src/alpha_factory/cross_pair.py
# - 概念: docs/alpha_factory/cross-pair.md
# - mode='shadow' (Phase 2 default): Stage C passed には影響させず archive 記録のみ
# - mode='hard'   (Phase 4 で切替): 通過基準を Stage C の AND に組み込む (別 TODO)
# YAML loader は別 TODO (run-ga 統合) で実装。本セクションは SSOT としてのみ。
cross_pair:
  mode: shadow
  aggregator_lambda: 0.5            # F = mean - λ × std
  pass_criteria:
    sharpe_target_cross_ratio_min: 0.8   # Phase 2 では provider 注入時のみ有効
    mean_sharpe_cross_min: 0.15
    min_sharpe_cross_min: -0.20
  anchors:
    EUR_JPY: [EUR_USD, USD_JPY]
    USD_JPY: [USD_CAD, EUR_JPY]
    EUR_USD: [EUR_JPY, USD_CAD]
    AUD_JPY: [USD_JPY, EUR_USD]
    USD_CAD: [USD_JPY, EUR_USD]
    USD_ZAR: [USD_CAD, USD_JPY]

# Swim lane manager (T017)
# - 実装: src/alpha_factory/swim_lane.py (LaneManager + Tier1Lane + GraduationLane)
# - 概念: docs/alpha_factory/swim-lane.md / concepts/swim-lane-manager.md
# - 本セクションは SSOT のみ (YAML loader / SwimLaneConfig dataclass は
#   run-ga-full-rewrite TODO で導入)。
# - tier1 は 6 通貨ペアに lane を張る想定で、population_size / generations
#   は lane 共通 (ペア別カスタム化は別 TODO)。
swim_lane:
  tier1:
    population_size: 30
    generations: 15
    crossover_rate: 0.7
    mutation_rate: 0.3
    elite_count: 2
  graduation:
    population_size: 40
    seed_strategy: "union_of_tier1_graduates"
  graduation_criteria:
    require_stage_c_pass: true
    require_cross_pair_pass: true

# 改善サイクル設定
improve_cycle:
  # repeat mode 1 サイクルあたりの最大経過時間（秒）。超過したら次サイクルへ
  max_cycle_seconds: 3600
  # 何サイクル連続で best fitness が改善しなかったら mutation_rate を 0.05 刻みで増やすか
  plateau_cycles: 3
  plateau_mutation_bump: 0.05
  mutation_rate_max: 0.6
