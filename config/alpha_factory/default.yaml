# Alpha Factory FX 既定設定
#
# improve-cycle から参照される GA / バックテストの既定パラメータと、
# 使命達成の判定に用いる live_criteria を定義する。
#
# 使命: 以下 live_criteria を全て満たすイントラデイ FX 戦略ゲノムを 1 つ以上見つけ出すこと。

dataset:
  instrument: EUR_JPY
  # ISO 8601 (UTC) — バックテスト対象期間
  start: "2025-10-01T00:00:00Z"
  end: "2026-04-01T00:00:00Z"

backtest:
  initial_cash: "1000000"
  leverage: 25
  units: 10000
  # T041 Phase 0 / Stage C unblock:
  # @why: max_spread_bps 未設定のとき stage_gate.evaluate_stage_c は
  # `spread_stress_skipped` 理由を必ず追加し Stage C を fail-closed する
  # (src/alpha_factory/stage_gate.py:630-632)。Run 1〜16 の Stage C pass=0 は
  # この未設定が上流原因。AGENTS.md「絶対制約: スワップ・スプレッドを
  # fitness に反映」遵守のため Phase 0 で導入。
  # 値根拠: EUR_JPY tier1 broker (OANDA) の典型 spread 1.0〜2.0 pips ≈
  # 6〜12 bps の保守的中央値 10 bps (≈ 1.4 pips)。Stage C stress 1.5x で
  # base 15 bps (≈ 2.1 pips) で評価される。
  # 通貨ペア別 override は Phase 1 で per_pair_overrides として検討。
  max_spread_bps: "10"
  # @why: 明示 0 でイントラデイ前提を表現 (overnight 持ち越し設計禁止)。
  # holding cost 反映は将来別タスクで設計。
  holding_cost_per_day_bps: "0"

ga:
  population_size: 40
  generations: 15
  crossover_rate: 0.7
  mutation_rate: 0.3
  tournament_size: 3
  elite_count: 2
  max_depth: 4
  fitness_metric: sharpe
  # T-sharpe Phase 1A: trade-level Sharpe のサンプルサイズ最小値。
  # @why: trade_count<N で trade_sharpe_raw を None にして GA fitness の選抜から外す。
  # 30 は Andrew W. Lo (2002) "The Statistics of Sharpe Ratios" の経験則。
  # Phase 1B replay で N=20/30/50 の感度分析を実施し再校正する。
  trade_count_min_for_sharpe: 30
  seed:       # null = 毎 Run ランダム
  # T031 RPC Phase 1: trade_count=0 個体を selection_score の feasibility 要素で淘汰。
  # @why: Run 10 で best=trade_count=3 / sharpe=18.5 (見かけ Sharpe) という no-trade attractor を破壊し、
  # Stage A 通過個体に最低取引密度 (>=1) を構造的に要求する。
  feasibility:
    entry_count_min: 1                          # Phase 1: trade_count >= 1 を feasible 条件
    apply_from_generation: 0                    # 0 世代目から制約適用
    enable_fallback_when_all_infeasible: true   # 全個体 infeasible で旧 4 要素にフォールバック

# 使命達成判定 — 全てを満たす個体が出現すれば使命達成
# T042 Phase 0: sharpe_min は **annualized Sharpe** スケール (S_annual ≈ S_trade ×
# sqrt(λ_day × 252) で換算後の値で比較する)。GA fitness や payload に出る
# trade_sharpe_raw とはスケールが異なる。
# 詳細: docs/alpha_factory/sharpe-rescale.md
# 学術引用: Andrew W. Lo (2002), "The Statistics of Sharpe Ratios".
live_criteria:
  sharpe_min: 1.0           # annualized Sharpe (T042 換算後比較)
  total_pnl_min: 50000      # 50k JPY over dataset window
  max_drawdown_max: 0.2     # 20%
  trade_count_min: 50
  trade_count_max: 5000

# Stage A/B/C ゲート設定 (T014 実装)
# - Stage A の評価関数は src/alpha_factory/stage_gate.py::evaluate_stage_a
# - Stage B / C も同モジュールに pure function として実装。
# - StageGateConfig (frozen dataclass) を yaml から構築する loader は
#   別 TODO (GA runner 統合) で実装。本ファイルは SSOT としてのみ。
stage_gate:
  stage_a:
    window_days: 60
    target_pass_rate: 0.15      # 探索圧の代理指標 (calibrate-gate T027 で使用)
    alpha: 0.03
    threshold: 0.0              # cycle 4 reset: WF 短縮 (cycle 3) で fitness 分布が変化、旧 gate 過剰で Stage A pass=0 となったため baseline へ戻す。本 cycle は calibrate-gate skip。
    # T027 calibrate-gate 設定 (deterministic 制御則)
    # - 概念設計: docs/alpha_factory/concepts/calibrate-gate.md
    # - SSOT: 本セクション、loader: scripts/alpha_factory/calibrate_gate.py
    calibrate:
      enabled: true
      # last_k_generations / all_generations / generation_weighted_mean
      aggregation_mode: last_k_generations
      aggregation_window: 5
      pass_rate_tolerance_abs: 0.05      # dead-band 半幅 (pass_rate 絶対)
      threshold_delta_abs_max: 0.5       # 1 Run の変更幅上限 (fitness_pen 絶対)
      threshold_floor: -100.0
      threshold_ceiling: 100.0
      min_sample_size: 30                # この未満は skip + WARN
      eps_var: 0.000000001               # quantile-snap skip 判定 (var(fitness_pen))
  stage_b:
    window_months: 18
    # Cycle 3 (Run-13 観測結果) intervention:
    # @why: Run-13 で Stage B failure reason が insufficient_folds=100% 単峰化。
    # WF 必要観測日数 (train=120 + embargo=1 + test=20 = 141) > Stage B window 観測日数 (~127)
    # で構造的に fold が 1 個しか作れず insufficient_folds で常に reject されていた。
    # train/test を半分にして fold 成立を狙う (train=60+embargo=1+test=10=71)。
    # 注: Sharpe / positive_fold 閾値は不変。目的は「fold 成立」のみ (Codex 案 A)。
    # 構造的フィージビリティ契約 (T038 候補) は別 cycle で本格実装予定。
    wf_train_days: 60
    wf_test_days: 10
    wf_step_days: 10
    wf_embargo_days: 1
    # T042 Phase 0: trade-level スケール (per-fold trade_sharpe_raw との比較)。
    # Stage B は per-fold WF OOS の中央値を判定するため annualized でなく
    # trade-level 値を使う (Stage A threshold と同じスケール)。
    # 旧 0.20 は v1 bar-level 想定の legacy 値で、Run 14-16 replay
    # (reports/sharpe-rescale/) では trade-level median 0.05〜0.19。
    # 0.05 で 50%程度 fold が pass する想定で出発、calibrate-gate では
    # 制御していないため Phase 1 の per-fold 分布測定に基づき再校正予定。
    median_oos_sharpe_min: 0.05  # trade-level (T042 再校正)
    positive_fold_min: 0.60
    dsr_min: 0.0                # monitor_only (Phase 4 で hard 化)
    # T044: pre-flight feasibility (LaneManager で max_folds < min なら全 lane 全個体 skip)
    wf_min_folds_required: 2
  stage_c:
    holdout_days: 60
    spread_stress_multiplier: 1.5
    # 1.5x stress 後の hard gate 下限 (live_criteria.* を流用しないため別定義)
    spread_stress_min_total_pnl: 0.0
    spread_stress_min_sharpe: 0.0
    # live_criteria は上記 SSOT セクションを参照 (重複定義しない)

# Cross-pair (ii-lite) evaluation 設定 (T016)
# - 実装: src/alpha_factory/cross_pair.py
# - 概念: docs/alpha_factory/cross-pair.md
# - mode='shadow' (Phase 2 default): Stage C passed には影響させず archive 記録のみ
# - mode='hard'   (Phase 4 で切替): 通過基準を Stage C の AND に組み込む (別 TODO)
# YAML loader は別 TODO (run-ga 統合) で実装。本セクションは SSOT としてのみ。
cross_pair:
  mode: shadow
  aggregator_lambda: 0.5            # F = mean - λ × std
  pass_criteria:
    sharpe_target_cross_ratio_min: 0.8   # Phase 2 では provider 注入時のみ有効
    mean_sharpe_cross_min: 0.15
    min_sharpe_cross_min: -0.20
  anchors:
    EUR_JPY: [EUR_USD, USD_JPY]
    USD_JPY: [USD_CAD, EUR_JPY]
    EUR_USD: [EUR_JPY, USD_CAD]
    AUD_JPY: [USD_JPY, EUR_USD]
    USD_CAD: [USD_JPY, EUR_USD]
    USD_ZAR: [USD_CAD, USD_JPY]

# Swim lane manager (T017)
# - 実装: src/alpha_factory/swim_lane.py (LaneManager + Tier1Lane + GraduationLane)
# - 概念: docs/alpha_factory/swim-lane.md / concepts/swim-lane-manager.md
# - 本セクションは SSOT のみ (YAML loader / SwimLaneConfig dataclass は
#   run-ga-full-rewrite TODO で導入)。
# - tier1 は 6 通貨ペアに lane を張る想定で、population_size / generations
#   は lane 共通 (ペア別カスタム化は別 TODO)。
swim_lane:
  tier1:
    population_size: 30
    generations: 15
    crossover_rate: 0.7
    mutation_rate: 0.3
    elite_count: 2
  graduation:
    population_size: 40
    seed_strategy: "union_of_tier1_graduates"
  graduation_criteria:
    require_stage_c_pass: true
    require_cross_pair_pass: true

# 改善サイクル設定
improve_cycle:
  # repeat mode 1 サイクルあたりの最大経過時間（秒）。超過したら次サイクルへ
  max_cycle_seconds: 3600
  # 何サイクル連続で best fitness が改善しなかったら mutation_rate を 0.05 刻みで増やすか
  plateau_cycles: 3
  plateau_mutation_bump: 0.05
  mutation_rate_max: 0.6
