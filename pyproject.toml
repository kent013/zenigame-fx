[project]
name = "zenigame-fx"
version = "0.1.0"
description = "FX trading system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]>=3.1",
    "httpx",
    "tenacity",
    "diskcache",
    "pydantic>=2",
    "pydantic-settings",
    "structlog",
    "pyyaml>=6.0.3",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "mypy",
    "respx",
    "testcontainers[postgres]",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 日本語コメント中の全角括弧・波ダッシュは意図的なので許容
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires running container (Docker/Postgres testcontainer)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
